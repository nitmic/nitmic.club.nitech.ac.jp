{{ define "main" }}

<main class="main" role="main">
    <article class="post">
        <header class="post__header">
            <h1 class="post__title">{{ .Title }}</h1>
        </header>
    </article>
</main>

{{ range hugo.Data.member }}

{{ $members := where .Members "past" false }}

{{ if gt (len $members) 0 }}
{{ with .Year }}
<h4>{{ . }}入学</h4>
{{ end }}

<div class="cards">
    {{ range $members }}
    {{ partial "member.html" . }}
    {{ end }}
</div>

<br>
{{ end }}

{{ end }}

{{ end }}
