{{ define "main" }}

    <main class="main" role="main">
        <article class="post">
            <header class="post__header">
                <h1 class="post__title">{{ .Title }}</h1>
            </header>
        </article>
    </main>

    {{ range .Site.Data.member }}

        {{ if (and (ge .Year 2020) (le .Year 2025)) }}

        {{ with .Year }}
            <h4>{{ . }}入学</h4>
        {{ end }}

        <div class="cards">
            {{ range .Members }}
                {{ partial "member.html" . }}
            {{ end }}
        </div>

        <br>

        {{ end }}

    {{ end }}

{{ end }}
